<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
    <title>Start gulp</title>
  </head>

  <body>
    <div class="wrapper">
      <header class="header">
        <div class="container">
          <div class="header__inner"></div>
        </div>
      </header>
      <main class="main">
        <section class="main__section section">
          <div class="container">
            <div class="section__inner">
              <a class="trigger" href="#">Связаться</a>
            </div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <div class="container">
          <div class="footer__inner"></div>
        </div>
      </footer>
    </div>

    <div class="modal">
      <div class="modal__dialog">
        <div class="modal__content">
          <form class="callback-form">
            <div class="callback-form__head">
              <h3 class="callback-form__title">Зворотній дзвінок</h3>
              <div class="modal__close">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M6.34435 6.34315L17.6581 17.6569M6.34435 17.6569L17.6581 6.34315"
                    stroke="#282828"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </div>
            </div>

            <div class="callback-form__content">
              <div class="callback-form__box">
                <label class="callback-form__label">Ім’я</label>
                <input class="callback-form__input" type="text" />
              </div>

              <div class="callback-form__box">
                <label class="callback-form__label">Телефон</label>
                <input class="callback-form__input" type="text" />
              </div>

              <div class="callback-form__box">
                <label class="callback-form__label">Коментар</label>
                <textarea class="callback-form__textarea"></textarea>
              </div>

              <button class="callback-form__btn">Замовити дзвінок</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
