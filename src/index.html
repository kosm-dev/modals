              </ul>
            </nav>

          <form class="callback-form">
            <div class="callback-form__head">
              <h3 class="callback-form__title">Зворотній дзвінок</h3>
              <div class="modal__close">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M6.34435 6.34315L17.6581 17.6569M6.34435 17.6569L17.6581 6.34315"

                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </div>
            </div>

            <div class="callback-form__content">
              <div class="callback-form__box">
                <label class="callback-form__label">Ім’я</label>
                <input class="callback-form__input" type="text" />
              </div>

              <div class="callback-form__box">
                <label class="callback-form__label">Телефон</label>
                <input class="callback-form__input" type="text" />
              </div>

              <div class="callback-form__box">
                <label class="callback-form__label">Коментар</label>
                <textarea class="callback-form__textarea"></textarea>
